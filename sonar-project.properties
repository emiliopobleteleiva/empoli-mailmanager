sonar.projectKey=empoli-mailmanager
sonar.projectName=Arpoli Mailmanager
sonar.sourceEncoding=UTF-8
sonar.sources=app,components,lib,db,worker,docker
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts,tests/**/*.test.tsx
sonar.exclusions=**/node_modules/**,dist/**,coverage/**,.scannerwork/**,vendor/**,components/ui/**,scripts/**,examples/**,outputs/**,work/**,**/*.d.ts
sonar.coverage.exclusions=tests/**,docker/**,scripts/**,components/ui/**,**/*.test.ts,**/*.test.tsx,**/*.d.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.json
sonar.javascript.node.maxspace=2048
